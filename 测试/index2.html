<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>核销成功</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        /* 状态栏 */
        .status-bar {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            background: #fff;
            font-size: 14px;
            color: #333;
        }

        /* 主容器 */
        .container {
            margin-top: 44px;
            padding: 20px;
        }

        /* 头部 */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .user-id {
            color: #8e8e93;
            font-size: 15px;
        }

        /* 成功状态 */
        .success-section {
            text-align: center;
            margin: 40px 0;


            display: flex;
            justify-content: center;
        }
        .check-icon {
            font-size: 36px;
            color: #34C759;
            margin-bottom: 20px;
        }
        .success-text {
            font-size: 24px;
            margin-bottom: 25px;


            margin-left: 12px;
        }

        /* 核销详情 */
        .details-card {
            /* background: #f8f8f8; */
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
        }
        .detail-label {
            color: #8e8e93;
        }
        .detail-value {
            font-weight: 500;
        }

        /* 操作按钮 */
        .action-buttons {
            display: flex;
            gap: 15px;
            margin: 30px 0;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border-radius: 25px;
            font-size: 17px;
            border: none;
        }
        .btn-close {
            background: #f2f2f2;
            color: #333;
        }
        .btn-continue {
            background: #007AFF;
            color: white;
        }

        /* 评价部分 */
        .rating-section {
            margin-top: 40px;
        }
        .rating-title {
            font-size: 16px;
            /* margin-bottom: 20px; */
            color: #ccc;
        }
        .stars {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;

            margin-top: 16px;
        }
        .star {
            font-size: 28px;
            color: #ffcc00;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 15px;
            border: 1px solid #e5e5ea;
            border-radius: 12px;
            margin: 15px 0;
            resize: none;
        }

        .submit-btn {
            background: #1effff;
            color: white;
            /* padding: 16px 40px; */
            border-radius: 25px;
            border: none;
            /* float: right; */
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);

            width: 100px;
            height: 35px;
            border: 1px #007AFF solid;


            color: #007AFF;
        }


        .line1{


            width: 100px;
            height: 1px;
            background: #ccc;
        }
        .ppp{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .btn1{


            width: 100%;
            display: flex;


            justify-content: center;
        }

        .stars p{


            display: flex;


            flex-direction: column;


            align-items: center;
            
        }
        a{
            text-decoration: none;
            color: black;
        }
    </style>
</head>
<body>
    <!-- 状态栏 -->
    

    <div class="container">
        <!-- 头部 -->
        <!-- <div class="header">
            <h1 class="title">自助核销</h1>
            <div class="user-id">user.aiyzgr3.aliyouzhan.cn</div>
        </div> -->

        <!-- 成功状态 -->
        <div class="success-section">
            <i class="fas fa-check-circle check-icon"></i>
            <div class="success-text">核销成功</div>
        </div>

        <!-- 核销详情 -->
        <div class="details-card">
            <span>核销项</span>
            <div class="detail-row">
                
                <span class="detail-label">洗车券</span>
                <div class="detail-value">
                    <span style="margin-left: 10px; color: #8e8e93" >x<span id="quantityDisplay"></span></span>
                </div>
            </div>
            <div class="detail-row">
                <span class="detail-label">服务时间</span>
                <span class="detail-value" id="timeDisplay">2024-12-10 14:49:20</span>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="action-buttons">
            <button class="btn btn-close"><a href="./index.html">关闭</a> </button>
            <button class="btn btn-continue"><a href="./index.html" style="color: white;">继续核销</a> </button>
        </div>

        <!-- 评价部分 -->
        <div class="rating-section">
           

           <div class="ppp"><p class="line1"></p><h3 class="rating-title">本次核销评价</h3><p class="line1"></p></div> 
            <div class="stars">
                <p><i class="fas fa-star star"></i><span>1分</span></p>
               <p><i class="fas fa-star star"></i><span>2分</span></p> 
               <p><i class="fas fa-star star"></i><span>3分</span></p> 
               <p><i class="fas fa-star star"></i><span>4分</span></p> 
               <p><i class="fas fa-star star"></i><span>5分</span></p> 
            </div>
            <textarea placeholder="其他意见或建议可进行填写"></textarea>
           <div class="btn1"><button class="submit-btn">提交</button></div> 
        </div>
    </div>
</body>


<script>
    // 获取当前时间并格式化
    const timeDisplay = document.getElementById('timeDisplay');
    const currentDate = new Date();
    
    // 格式化为YYYY-MM-DD HH:mm:ss
    const formattedDate = currentDate.toLocaleDateString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
    }).replace(/\//g, '-');
    
    const formattedTime = currentDate.toLocaleTimeString('zh-CN', {
        hour12: false,
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
    });

    timeDisplay.textContent = `${formattedDate} ${formattedTime}`;
    const quantity = localStorage.getItem('核销数量') || 1;
    document.getElementById('quantityDisplay').textContent = quantity;
</script>
</html>
